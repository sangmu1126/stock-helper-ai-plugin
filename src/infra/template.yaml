AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Safe Trade Rule Builder runtime scaffold.

Parameters:
  StateBackend:
    Type: String
    Default: memory
    AllowedValues:
      - memory
      - dynamodb
  DecisionLogBackend:
    Type: String
    Default: memory
    AllowedValues:
      - memory
      - dynamodb

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        SAFE_TRADE_ENV: prod
        SAFE_TRADE_STATE_BACKEND: !Ref StateBackend
        SAFE_TRADE_DECISION_LOG_BACKEND: !Ref DecisionLogBackend
        SAFE_TRADE_STATE_TABLE: !Ref SafeTradeStateTable
        SAFE_TRADE_DECISION_LOG_TABLE: !Ref SafeTradeDecisionLogTable

Resources:
  SafeTradeRuntimeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_handler.lambda_handler
      CodeUri: ../runtime/
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSXRayDaemonWriteAccess
        - DynamoDBCrudPolicy:
            TableName: !Ref SafeTradeStateTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SafeTradeDecisionLogTable

  SafeTradeStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: N
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl_epoch_seconds
        Enabled: true

  SafeTradeDecisionLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: decision_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: N
      KeySchema:
        - AttributeName: decision_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user-decisions-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl_epoch_seconds
        Enabled: true

Outputs:
  RuntimeFunctionName:
    Value: !Ref SafeTradeRuntimeFunction
  StateTableName:
    Value: !Ref SafeTradeStateTable
  DecisionLogTableName:
    Value: !Ref SafeTradeDecisionLogTable
